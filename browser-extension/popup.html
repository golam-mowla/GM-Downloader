<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download with Parrot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo-box">
      <img src="icons/icon48.png" alt="Parrot" class="logo-img">
      <div class="title-group">
        <span class="app-title">GM Downloader</span>
        <span class="app-sub">Download with Parrot</span>
      </div>
    </div>
    <span class="version-badge">v2.0.2</span>
  </div>

  <div class="status-card">
    <div class="status-indicator">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">Checking Desktop App...</span>
    </div>
  </div>

  <div class="main-body">
    <div class="section-title">Current Tab Media Link</div>
    <div class="current-url-box" id="current-url" title="Current tab URL">Detecting current link...</div>
    <button class="btn btn-primary" id="btn-download-current">
      <span class="btn-icon">🦜</span>
      <span>Download Current Media</span>
    </button>

    <div class="divider"><span>OR PASTE LINK</span></div>

    <div class="input-group">
      <input type="text" id="custom-url-input" placeholder="Paste YouTube, Instagram, Facebook link...">
      <button class="btn btn-secondary" id="btn-download-custom">Send to Parrot</button>
    </div>
  </div>

  <div class="footer">
    <span>💡 Tip: Right-click any video or link and choose <b>Download with Parrot</b></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
